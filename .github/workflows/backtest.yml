# Rückblick-Test des Ratgebers: prüft Nachkauf-Stufen und Punktzahl an der
# Vergangenheit und speichert das Ergebnis (status/backtest.json, docs/RUECKBLICK.md).
# Läuft am 2. jedes Monats; manuell über „Run workflow“.
name: Rückblick-Test

on:
  schedule:
    - cron: "41 4 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rückblick-Test
        run: python -m tradingagent backtest | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis speichern
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/backtest.json docs/RUECKBLICK.md
          if ! git diff --cached --quiet; then
            git commit -m "Rückblick-Test aktualisiert"
            git pull --rebase
            git push
          fi

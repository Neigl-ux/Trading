# Einmaliger Test: Abendkurse anderer Börsenplätze bei Yahoo. Startet bei Änderung des Skripts oder manuell.
name: Börsenplätze testen

on:
  workflow_dispatch:
  push:
    paths: [scripts/venue_check.py, .github/workflows/venue-check.yml]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/venue_check.py
      - name: Ergebnis speichern
        run: |
          git config user.name "trading-agent"
          git config user.email "actions@users.noreply.github.com"
          git add docs/VENUE_CHECK.md
          git commit -m "Test Börsenplätze: Ergebnis" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

# Wiederholt einen fehlgeschlagenen Lauf von „Daten sammeln“ automatisch (höchstens zweimal).
# Hintergrund: GitHub Pages meldet gelegentlich kurz nach dem Hochladen „No artifacts named github-pages“,
# obwohl das Hochladen geklappt hat. Ein zweiter Versuch eine Minute später läuft dann durch.
# Das Sammeln selbst ist wiederholbar: Kerzen werden per Upsert gespeichert, es entstehen keine Doppelten.

name: Lauf wiederholen

on:
  workflow_run:
    workflows: ["Daten sammeln"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Eine Minute warten und erneut starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Lauf ${{ github.event.workflow_run.id }} (Versuch ${{ github.event.workflow_run.run_attempt }}) ist fehlgeschlagen."
          sleep 60
          gh run rerun ${{ github.event.workflow_run.id }} --failed -R ${{ github.repository }}

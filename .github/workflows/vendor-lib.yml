# Einmalig: Chart-Bibliothek (Lightweight Charts, Apache-2.0) ins Projekt legen.
name: Bibliothek holen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm pack lightweight-charts@4.2.0
          tar -xzf lightweight-charts-4.2.0.tgz
          mkdir -p app/vendor
          cp package/dist/lightweight-charts.standalone.production.js app/vendor/
          cp package/LICENSE app/vendor/LICENSE-lightweight-charts.txt
          rm -rf package lightweight-charts-4.2.0.tgz
          git config user.name "trading-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/vendor
          git commit -m "Chart-Bibliothek 4.2.0 ins Projekt gelegt" && git push

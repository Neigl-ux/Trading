# Phase 5: Strategien im Rückblick (Regeln und Kosten aus Phase 4). Ergebnis: docs/STRATEGIEN.md,
# status/strategien.json und app/strategien.json (für die App). Am 3. jedes Monats und manuell;
# zusätzlich jeden Sonntag auf dem Server.
name: Strategien testen

on:
  schedule:
    - cron: "23 5 3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/tradingagent/strategy_test.py, src/tradingagent/strategies.py, .github/workflows/strategien.yml]

permissions:
  contents: write

concurrency:
  group: strategien
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Strategien testen
        run: python -m tradingagent strategien | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis speichern
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/strategien.json docs/STRATEGIEN.md app/strategien.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 5: Strategien im Rückblick aktualisiert"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi

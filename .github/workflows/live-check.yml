# Manuell startbar: prüft die Prozentberechnung mit echten Marktdaten (Kraken).
name: Live-Prüfung

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/live_market_check.mjs
